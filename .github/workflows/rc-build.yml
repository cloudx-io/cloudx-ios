name: Release Candidate Build & Publish

# ============================================================================
# CloudX iOS SDK - Automatic Release Candidate Builds
# ============================================================================
#
# TRIGGER: Every push to 'release/**' branches (e.g., release/1.2.0)
#
# WHAT IT DOES:
#   1. Extracts base version from podspecs
#   2. Generates RC version: 1.2.0-rc.2+a1b2c3d
#      - rc.2 = release candidate build #2 (from GitHub run number)
#      - a1b2c3d = Git commit SHA
#   3. Updates all version constants (Core, Meta, Vungle, Renderer)
#   4. Validates podspecs (ensures they're ready for CocoaPods)
#   5. Builds all components as xcframeworks
#   6. Creates GitHub pre-release with testing checklist
#
# COMPONENTS BUILT:
#   - CloudXCore
#   - CloudXMetaAdapter
#   - CloudXVungleAdapter
#   - CloudXInMobiAdapter
#   - CloudXMintegralAdapter
#   - CloudXRenderer
#
# NOT INCLUDED (not ready for public release):
#   - CloudXMolocoAdapter
#
# GIT TAGS:
#   NO git tags are created for RC builds.
#   Only stable releases off main get tagged.
#
# RELEASE WORKFLOW:
#   1. Create release/X.Y.Z branch → This workflow runs automatically
#   2. Test the RC build thoroughly
#   3. If tests pass, merge to main (squash merge)
#   4. Tag main with component tags: v1.2.0-core, v1.2.0-meta, etc.
#
# ============================================================================

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version
      
      - name: Extract base version from podspec
        id: version
        run: |
          BASE_VERSION=$(grep "s.version.*=" core/CloudXCore.podspec | head -1 | sed "s/.*['\"]\\([^'\"]*\\)['\"].*/\\1/")
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION"
      
      - name: Generate RC version with metadata
        id: fullversion
        run: |
          FULL_VERSION=$(./scripts/generate-version.sh ${{ steps.version.outputs.base_version }} rc ${{ github.run_number }})
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Generated RC version: $FULL_VERSION"
      
      # ========== UPDATE ALL VERSION CONSTANTS ==========
      
      - name: Update Core SDK version constant
        run: |
          ./scripts/update-version-constant.sh core "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update Meta Adapter version constant
        run: |
          ./scripts/update-version-constant.sh meta "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXMetaAdapterVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update Vungle Adapter version constant
        run: |
          ./scripts/update-version-constant.sh vungle "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXVungleAdapterVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update Renderer version constant
        run: |
          ./scripts/update-version-constant.sh renderer "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXRendererVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update InMobi Adapter version constant
        run: |
          ./scripts/update-version-constant.sh inmobi "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXInMobiAdapterVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update Mintegral Adapter version constant
        run: |
          ./scripts/update-version-constant.sh mintegral "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXMintegralAdapterVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      # ========== VALIDATE PODSPECS ==========
      
      - name: Validate podspecs
        run: |
          pod lib lint core/CloudXCore.podspec --allow-warnings --skip-import-validation --skip-tests
          pod lib lint renderer-cloudx/CloudXRenderer.podspec --allow-warnings --skip-import-validation --skip-tests --include-podspecs='core/CloudXCore.podspec'
      
      # ========== BUILD ALL XCFRAMEWORKS ==========
      
      - name: Build Core xcframework
        run: |
          cd core
          ./build-xcframework.sh ${{ steps.fullversion.outputs.full_version }}
      
      - name: Build Meta Adapter xcframework
        run: |
          cd adapter-meta
          ./build-xcframework.sh
      
      - name: Build Vungle Adapter xcframework
        run: |
          cd adapter-vungle
          ./build-xcframework.sh
      
      - name: Build Renderer xcframework
        run: |
          cd renderer-cloudx
          ./build-xcframework.sh ${{ steps.fullversion.outputs.full_version }}
      
      - name: Build InMobi Adapter xcframework
        run: |
          cd adapter-inmobi
          ./build-xcframework.sh
      
      - name: Build Mintegral Adapter xcframework
        run: |
          cd adapter-mintegral
          ./build-xcframework.sh
      
      # ========== PREPARE RC PODSPECS ==========
      # Copy templates from rc-podspecs/ and update version/URL placeholders
      
      - name: Prepare RC Podspecs
        run: |
          VERSION="${{ steps.fullversion.outputs.full_version }}"
          RELEASE_URL="https://github.com/cloudx-io/cloudx-ios-private/releases/download/${VERSION}"
          
          # Copy templates to build directory
          mkdir -p build/rc-podspecs
          cp rc-podspecs/*.podspec build/rc-podspecs/
          
          # Replace placeholders with actual values
          for podspec in build/rc-podspecs/*.podspec; do
            sed -i '' "s|VERSION_PLACEHOLDER|${VERSION}|g" "$podspec"
            sed -i '' "s|RELEASE_URL_PLACEHOLDER|${RELEASE_URL}|g" "$podspec"
          done
          
          echo "✅ Prepared RC podspecs with version: ${VERSION}"
          ls -la build/rc-podspecs/
      
      # ========== CREATE GITHUB RELEASE ==========
      
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.fullversion.outputs.full_version }}"
          
          cat > release_notes.md << EOF
          ## CloudX iOS SDK - Release Candidate
          
          **Version:** \`${{ steps.fullversion.outputs.full_version }}\`  
          **Build:** #${{ github.run_number }}  
          **Commit:** \`${{ github.sha }}\`  
          **Branch:** \`${GITHUB_REF#refs/heads/}\`
          
          ### 📦 Components Built
          - CloudXCore
          - CloudXMetaAdapter
          - CloudXVungleAdapter
          - CloudXInMobiAdapter
          - CloudXMintegralAdapter
          - CloudXRenderer
          
          ### ✅ Pre-Release Testing
          
          This is a release candidate build for final validation before public release.
          
          ### 📋 Testing Checklist
          - [ ] Banner ads load correctly
          - [ ] MREC ads load correctly
          - [ ] Interstitial ads display properly
          - [ ] Rewarded ads display properly
          - [ ] SDK version reports correctly in requests
          - [ ] No crashes or memory leaks
          
          ### 🔧 Integration (use in Podfile)
          \`\`\`ruby
          # Point to RC podspecs from release assets
          pod 'CloudXCore', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXCore.podspec'
          pod 'CloudXMetaAdapter', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXMetaAdapter.podspec'
          pod 'CloudXVungleAdapter', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXVungleAdapter.podspec'
          pod 'CloudXInMobiAdapter', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXInMobiAdapter.podspec'
          pod 'CloudXMintegralAdapter', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXMintegralAdapter.podspec'
          pod 'CloudXRenderer', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXRenderer.podspec'
          \`\`\`
          
          ### 🔗 Links
          - **Commit:** https://github.com/cloudx-io/cloudx-ios-private/commit/${{ github.sha }}
          - **Workflow:** https://github.com/cloudx-io/cloudx-ios-private/actions/runs/${{ github.run_id }}
          EOF
          
          gh release create "$RELEASE_TAG" \
            --title "iOS SDK Release Candidate ${{ github.run_number }}" \
            --notes-file release_notes.md \
            --prerelease \
            --target ${{ github.sha }}
          
          # Upload all xcframework zips
          if [ -f core/CloudXCore.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" core/CloudXCore.xcframework.zip
          fi
          if [ -f adapter-meta/CloudXMetaAdapter.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" adapter-meta/CloudXMetaAdapter.xcframework.zip
          fi
          if [ -f adapter-vungle/CloudXVungleAdapter.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" adapter-vungle/CloudXVungleAdapter.xcframework.zip
          fi
          if [ -f renderer-cloudx/CloudXRenderer.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" renderer-cloudx/CloudXRenderer.xcframework.zip
          fi
          if [ -f adapter-inmobi/CloudXInMobiAdapter.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" adapter-inmobi/CloudXInMobiAdapter.xcframework.zip
          fi
          if [ -f adapter-mintegral/CloudXMintegralAdapter.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" adapter-mintegral/CloudXMintegralAdapter.xcframework.zip
          fi
          
          # Upload RC podspecs
          for podspec in build/rc-podspecs/*.podspec; do
            if [ -f "$podspec" ]; then
              gh release upload "$RELEASE_TAG" "$podspec"
            fi
          done
          
          echo "✅ Uploaded all xcframeworks and podspecs"
      
      - name: Summary
        run: |
          echo "## 🎯 Release Candidate Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.fullversion.outputs.full_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Components Built" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXCore" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXMetaAdapter" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXVungleAdapter" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXInMobiAdapter" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXMintegralAdapter" >> $GITHUB_STEP_SUMMARY
          echo "- CloudXRenderer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Integration" >> $GITHUB_STEP_SUMMARY
          echo "Add to your Podfile:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`ruby" >> $GITHUB_STEP_SUMMARY
          echo "pod 'CloudXCore', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXCore.podspec'" >> $GITHUB_STEP_SUMMARY
          echo "pod 'CloudXRenderer', :podspec => 'https://github.com/cloudx-io/cloudx-ios-private/releases/download/${{ steps.fullversion.outputs.full_version }}/CloudXRenderer.podspec'" >> $GITHUB_STEP_SUMMARY
          echo "# Add adapters as needed..." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test this RC build thoroughly using the podspecs above" >> $GITHUB_STEP_SUMMARY
          echo "2. If all tests pass, merge to main (squash merge)" >> $GITHUB_STEP_SUMMARY
          echo "3. Sync to public repo and push to CocoaPods Trunk" >> $GITHUB_STEP_SUMMARY
