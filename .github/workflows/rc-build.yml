name: Release Candidate Build & Publish

# ============================================================================
# CloudX iOS SDK - Automatic Release Candidate Builds
# ============================================================================
#
# TRIGGER: Every push to 'release/**' branches (e.g., release/1.2.0)
#
# WHAT IT DOES:
#   1. Extracts base version from podspecs
#   2. Generates RC version: 1.1.58-rc.2+a1b2c3d
#      - rc.2 = release candidate build #2 (from GitHub run number)
#      - a1b2c3d = Git commit SHA
#   3. Updates all version constants
#   4. Validates podspecs (ensures they're ready for CocoaPods)
#   5. Builds all components (Core, Meta, Prebid)
#   6. Creates GitHub pre-release with testing checklist
#
# GIT TAGS:
#   NO git tags are created for RC builds (matches Android behavior).
#   Only stable releases off main get tagged.
#
# USAGE FOR PRE-PRODUCTION TESTING:
#   Download xcframeworks from GitHub Pre-Releases or use:
#     pod 'CloudXCore', :git => 'https://github.com/cloudx-io/cloudx-ios.git', :branch => 'release/1.2.0'
#
# RELEASE WORKFLOW:
#   1. Create release/X.Y.Z branch → This workflow runs automatically
#   2. Test the RC build thoroughly
#   3. If tests pass, merge to main
#   4. Manually push tag: git tag v1.1.58-core && git push origin v1.1.58-core
#   5. Triggers stable-release.yml which pushes to CocoaPods Trunk (public!)
#
# ============================================================================

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version
      
      - name: Extract base version from podspec
        id: version
        run: |
          BASE_VERSION=$(grep "s.version.*=" core/CloudXCore.podspec | head -1 | sed "s/.*['\"]\\([^'\"]*\\)['\"].*/\\1/")
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION"
      
      - name: Generate RC version with metadata
        id: fullversion
        run: |
          FULL_VERSION=$(./scripts/generate-version.sh ${{ steps.version.outputs.base_version }} rc ${{ github.run_number }})
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Generated RC version: $FULL_VERSION"
      
      - name: Update Core SDK version constant
        run: |
          ./scripts/update-version-constant.sh core "${{ steps.fullversion.outputs.full_version }}"
          echo "Updated CLXVersion.m to: ${{ steps.fullversion.outputs.full_version }}"
      
      - name: Update Meta Adapter version constant
        run: |
          META_BASE=$(grep "s.version.*=" adapter-meta/CloudXMetaAdapter.podspec | head -1 | sed "s/.*['\"]\\([^'\"]*\\)['\"].*/\\1/")
          META_FULL=$(./scripts/generate-version.sh "$META_BASE" rc ${{ github.run_number }})
          ./scripts/update-version-constant.sh meta "$META_FULL"
          echo "Updated CLXMetaAdapterVersion.m to: $META_FULL"
      
      - name: Update Prebid Adapter version constant
        run: |
          PREBID_BASE=$(grep "s.version.*=" adapter-cloudx/CloudXPrebidAdapter.podspec | head -1 | sed "s/.*['\"]\\([^'\"]*\\)['\"].*/\\1/")
          PREBID_FULL=$(./scripts/generate-version.sh "$PREBID_BASE" rc ${{ github.run_number }})
          ./scripts/update-version-constant.sh prebid "$PREBID_FULL"
          echo "Updated CLXPrebidAdapterVersion.m to: $PREBID_FULL"
      
      - name: Validate podspecs
        run: |
          cd core
          pod spec lint CloudXCore.podspec --allow-warnings --skip-import-validation --skip-tests
          cd ../adapter-cloudx
          pod spec lint CloudXPrebidAdapter.podspec --allow-warnings --skip-import-validation --skip-tests
      
      - name: Build Core framework
        run: |
          cd core
          xcodebuild -project CloudXCore.xcodeproj \
            -scheme CloudXCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build
      
      - name: Build Meta Adapter xcframework
        run: |
          cd adapter-meta
          ./build_frameworks.sh
      
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.fullversion.outputs.full_version }}"
          
          cat > release_notes.md << EOF
          ## CloudX iOS SDK - Release Candidate
          
          **Version:** \`${{ steps.fullversion.outputs.full_version }}\`  
          **Build:** #${{ github.run_number }}  
          **Commit:** \`${{ github.sha }}\`  
          **Branch:** \`${GITHUB_REF#refs/heads/}\`
          
          ### ✅ Pre-Release Testing
          
          This is a release candidate build for final validation before public release.
          
          ### 📦 Installation (Podfile)
          
          \`\`\`ruby
          # Use this specific RC build
          pod 'CloudXCore', :git => 'https://github.com/cloudx-io/cloudx-ios.git', :tag => '$RELEASE_TAG-core'
          pod 'CloudXMetaAdapter', :git => 'https://github.com/cloudx-io/cloudx-ios.git', :tag => '$RELEASE_TAG-meta'
          
          # Or use latest release branch
          pod 'CloudXCore', :git => 'https://github.com/cloudx-io/cloudx-ios.git', :branch => '${GITHUB_REF#refs/heads/}'
          \`\`\`
          
          ### 📋 Testing Checklist
          - [ ] Banner ads load correctly
          - [ ] Interstitial ads display properly
          - [ ] Rewarded ads work as expected
          - [ ] Win/loss notifications fire
          - [ ] Session metrics track correctly
          - [ ] No crashes or memory leaks
          
          ### 🔗 Links
          - **Commit:** https://github.com/cloudx-io/cloudx-ios/commit/${{ github.sha }}
          - **Workflow:** https://github.com/cloudx-io/cloudx-ios/actions/runs/${{ github.run_id }}
          EOF
          
          gh release create "$RELEASE_TAG" \
            --title "iOS SDK Release Candidate ${{ github.run_number }}" \
            --notes-file release_notes.md \
            --prerelease \
            --target ${{ github.sha }}
          
          if [ -f adapter-meta/CloudXMetaAdapter.xcframework.zip ]; then
            gh release upload "$RELEASE_TAG" adapter-meta/CloudXMetaAdapter.xcframework.zip
          fi
      
      - name: Summary
        run: |
          echo "## 🎯 Release Candidate Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.fullversion.outputs.full_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Testing This Build" >> $GITHUB_STEP_SUMMARY
          echo "Download the xcframework from the GitHub Pre-Release above" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** No git tags are created for RC builds (matches Android behavior)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test this RC build thoroughly" >> $GITHUB_STEP_SUMMARY
          echo "2. If all tests pass, merge to main" >> $GITHUB_STEP_SUMMARY
          echo "3. Manually push tag to create stable release: \`git tag v1.1.X-core && git push origin v1.1.X-core\`" >> $GITHUB_STEP_SUMMARY

