# CI: Build and Test
#
# Quality gate for all code changes. Runs on pushes to important branches
# and on all pull requests (regardless of target branch).

name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find available iPhone simulator
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available | grep "iPhone [0-9]" | grep -v "SE" | head -1 | sed 's/^[[:space:]]*//' | cut -d'(' -f1 | sed 's/[[:space:]]*$//')
          echo "Found simulator: $SIMULATOR"
          echo "name=$SIMULATOR" >> $GITHUB_OUTPUT

      - name: Run unit tests (parallel)
        working-directory: core
        run: |
          set -o pipefail
          xcodebuild test \
            -project CloudXCore.xcodeproj \
            -scheme CloudXCore \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}' \
            -parallel-testing-enabled YES \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/TestResults.xcresult
          retention-days: 7
