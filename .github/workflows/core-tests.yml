name: CloudXCore Unit Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run CloudXCore Unit Tests
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Run unit tests
        working-directory: core
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test \
            -project CloudXCore.xcodeproj \
            -scheme CloudXCore \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "Test Suite|Test Case|Executed|Assertion|error:|warning:" || cat xcodebuild.log
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/build/Logs/Test/*.xcresult
          retention-days: 7

