name: CloudXCore Unit Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run CloudXCore Unit Tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        working-directory: core
        run: |
          set -o pipefail
          xcodebuild test \
            -project CloudXCore.xcodeproj \
            -scheme CloudXCore \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/TestResults.xcresult
          retention-days: 7
