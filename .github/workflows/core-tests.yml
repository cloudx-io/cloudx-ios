name: CloudXCore Unit Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run CloudXCore Unit Tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find available iPhone simulator
        id: simulator
        run: |
          # Get the first available iPhone (not iPad, not SE) simulator
          SIMULATOR=$(xcrun simctl list devices available | grep "iPhone [0-9]" | grep -v "SE" | head -1 | sed 's/^[[:space:]]*//' | cut -d'(' -f1 | sed 's/[[:space:]]*$//')
          echo "Found simulator: $SIMULATOR"
          echo "name=$SIMULATOR" >> $GITHUB_OUTPUT

      - name: Run unit tests
        working-directory: core
        run: |
          set -o pipefail
          echo "Using simulator: ${{ steps.simulator.outputs.name }}"
          xcodebuild test \
            -project CloudXCore.xcodeproj \
            -scheme CloudXCore \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}' \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/TestResults.xcresult
          retention-days: 7
